<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT AI v28.0 Supreme Master - Institutional Trading Signal Engine</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131722;
            --border-color: #2a2e39;
            --text-primary: #d1d4dc;
            --text-secondary: #787b86;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-blue: #2962ff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            background: var(--accent-blue);
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .status {
            font-size: 13px;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .tf-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }
        .tf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .tf-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .signal-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .bullish {
            background-color: rgba(14, 203, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .bearish {
            background-color: rgba(246, 70, 93, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .metric-label {
            color: var(--text-secondary);
        }
        .metric-value {
            color: var(--text-primary);
            font-weight: 600;
        }
        .progress-bar-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 6px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            ORBIT AI v28.0 Supreme Master 
            <span class="badge">120+ Institutional Factors</span>
        </h1>
        <div class="status">
            <span class="status-dot"></span> Engine Online (All 9 Timeframes Active)
        </div>
    </header>

    <div class="dashboard-grid" id="signalGrid">
        <!-- Dynamic Cards for all 9 Timeframes will be injected here -->
    </div>

    <footer>
        ORBIT AI Institutional Signal Engine &copy; 2026 | Multi-Timeframe Execution Active
    </footer>

    <script>
        // List of all 9 Timeframes
        const timeframes = ['1m', '3m', '5m', '15m', '30m', '1h', '4h', '1d', '1w'];

        function generateSignals() {
            const grid = document.getElementById('signalGrid');
            grid.innerHTML = '';

            timeframes.forEach((tf, index) => {
                // Random signal generation (Bullish / Bearish)
                const isBullish = Math.random() > 0.45;
                const signalClass = isBullish ? 'bullish' : 'bearish';
                const signalText = isBullish ? 'STRONG BUY' : 'STRONG SELL';
                const confidence = Math.floor(Math.random() * (98 - 75 + 1)) + 75;
                
                // Price simulation based on index
                const basePrice = 64000 + (index * 125);
                const entry = basePrice.toFixed(2);
                const tp = isBullish ? (basePrice * 1.015).toFixed(2) : (basePrice * 0.985).toFixed(2);
                const sl = isBullish ? (basePrice * 0.992).toFixed(2) : (basePrice * 1.008).toFixed(2);

                const card = document.createElement('div');
                card.className = 'tf-card';
                card.innerHTML = `
                    <div class="tf-header">
                        <span class="tf-title">Timeframe: ${tf.toUpperCase()}</span>
                        <span class="signal-badge ${signalClass}">${signalText}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pair:</span>
                        <span class="metric-value">BTC/USDT (Perp)</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Entry Price:</span>
                        <span class="metric-value">$${entry}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Take Profit (TP):</span>
                        <span class="metric-value" style="color: var(--accent-green);">$${tp}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Stop Loss (SL):</span>
                        <span class="metric-value" style="color: var(--accent-red);">$${sl}</span>
                    </div>
                    <div class="metric-row" style="margin-top: 10px;">
                        <span class="metric-label">Institutional Confidence:</span>
                        <span class="metric-value">${confidence}%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${confidence}%; background-color: ${isBullish ? 'var(--accent-green)' : 'var(--accent-red)'};"></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initial call to generate signals on load
        generateSignals();

        // Auto-update signals for all 9 timeframes every 5 seconds
        setInterval(generateSignals, 5000);
    </script>
</body>
</html>
